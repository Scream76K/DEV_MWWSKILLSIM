<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHWilds 黄色アンカー自動検出 (16:9正規化版)</title>
  <style>
    :root {
      --bg-color: #0f141c;
      --card-bg: #1e2638;
      --accent-color: #00d5ff;
      --text-color: #e0e6ed;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h2 {
      font-size: 1.1rem;
      text-align: center;
      color: var(--accent-color);
      margin: 0 0 12px 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="file"] {
      background: var(--card-bg);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      width: 100%;
      box-sizing: border-box;
    }

    .canvas-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas#stage {
      width: 100%;
      height: auto;
      display: block;
    }

    .status-badge {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    .crops-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .crop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2d374d;
      padding-bottom: 6px;
    }

    .crop-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .crop-label {
      font-size: 0.85rem;
      width: 80px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .crop-canvas-wrapper canvas {
      display: block;
      height: 28px;
      width: auto;
      background: #000;
      border: 1px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>MHWilds 黄色アンカー自動検出</h2>
  <input type="file" id="imageInput" accept="image/*">
  
  <div class="status-badge" id="statusText">画像を選択してください</div>

  <div class="canvas-wrapper">
    <canvas id="stage"></canvas>
  </div>

  <div id="cropsContainer" class="crops-container" style="display: none;"></div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const statusText = document.getElementById('statusText');
  const cropsContainer = document.getElementById('cropsContainer');

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      stage.width = img.width;
      stage.height = img.height;
      ctx.drawImage(img, 0, 0);

      // 1. スマホスクショ内の16:9ゲーム有効描画エリアを計算
      const gameArea = calculate16by9Area(img.width, img.height);

      // 2. ピンポイントで黄色アイコンアンカーを検索
      const anchor = findYellowIconAnchor(stage, gameArea);

      if (!anchor) {
        statusText.textContent = "❌ 黄色アンカーの検出に失敗しました（標準計算を使用します）";
        statusText.style.color = "#ff3366";
        return;
      }

      statusText.textContent = `✅ 黄色アンカー検出成功! 座標: (${anchor.x}, ${anchor.y})`;
      statusText.style.color = "#00ff88";

      // 3. アンカー基準で7箇所のROIを計算
      const rois = calculateROIsFromAnchor(anchor, gameArea);

      // 4. アンカー(赤丸)とROI(水色枠)をプレビュー描画
      drawDebugOverlays(ctx, anchor, rois, gameArea);

      // 5. 切り出し個別プレビュー
      renderCropPreviews(img, rois);
    };
    img.src = URL.createObjectURL(file);
  });

  /**
   * 画像全体の中から 16:9 のゲーム表示領域 (X, Y, W, H) を算出
   */
  function calculate16by9Area(imgW, imgH) {
    const targetAspect = 16 / 9;
    const currentAspect = imgW / imgH;

    let gameW = imgW;
    let gameH = imgH;
    let offsetX = 0;
    let offsetY = 0;

    if (currentAspect > targetAspect) {
      gameW = imgH * targetAspect;
      offsetX = (imgW - gameW) / 2;
    } else if (currentAspect < targetAspect) {
      gameH = imgW / targetAspect;
      offsetY = (imgH - gameH) / 2;
    }

    return { x: offsetX, y: offsetY, w: gameW, h: gameH };
  }

  /**
   * ゲーム画面内の左上極小エリア(メイン武器アイコン左上)のみをピンポイント検索
   */
  function findYellowIconAnchor(canvas, gameArea) {
    const ctx = canvas.getContext('2d');

    // 16:9画面内の左上「メイン武器の黄色アイコン」が存在する絶対ピンポイント領域
    const scanX1 = Math.floor(gameArea.x + (gameArea.w * 0.038));
    const scanX2 = Math.floor(gameArea.x + (gameArea.w * 0.065));
    const scanY1 = Math.floor(gameArea.y + (gameArea.h * 0.190));
    const scanY2 = Math.floor(gameArea.y + (gameArea.h * 0.240));
    const scanW = scanX2 - scanX1;
    const scanH = scanY2 - scanY1;

    const imgData = ctx.getImageData(scanX1, scanY1, scanW, scanH);
    const data = imgData.data;

    let totalX = 0;
    let totalY = 0;
    let matchCount = 0;

    for (let y = 0; y < scanH; y++) {
      for (let x = 0; x < scanW; x++) {
        const idx = (y * scanW + x) * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];

        // 鮮やかな黄色/ゴールドの色の判定
        if (r > 160 && g > 130 && b < 100 && (r - b) > 70) {
          totalX += x;
          totalY += y;
          matchCount++;
        }
      }
    }

    if (matchCount < 5) return null;

    return {
      x: Math.round(scanX1 + (totalX / matchCount)),
      y: Math.round(scanY1 + (totalY / matchCount))
    };
  }

  /**
   * 黄色アンカーから精密オフセット計算でテキスト枠を配置
   */
  function calculateROIsFromAnchor(anchor, gameArea) {
    const scale = gameArea.w / 1920; // 1080p基準のスケール率

    // 1080p基準での黄色アンカー中心から「メイン武器」文字の左上までのピクセルオフセット
    // 1080p基準: アンカーY ≒ 232px, 文字Y ≒ 253px (差分 +21px)
    const offsetX1080 = 50;  // 右に50px
    const offsetY1080 = 21;  // 下に21px
    const pitch1080   = 85.3; // 行間ピッチ (1080p換算)
    const textW1080   = 240;
    const textH1080   = 35;

    const targets = [
      { key: 'weaponMain', label: 'メイン武器', row: 0 },
      { key: 'head',       label: '頭防具',     row: 2 },
      { key: 'chest',      label: '胴防具',     row: 3 },
      { key: 'arm',        label: '腕防具',     row: 4 },
      { key: 'waist',      label: '腰防具',     row: 5 },
      { key: 'leg',        label: '脚防具',     row: 6 },
      { key: 'charm',      label: '護石',       row: 7 }
    ];

    const rois = {};
    for (const t of targets) {
      rois[t.key] = {
        label: t.label,
        x: Math.round(anchor.x + (offsetX1080 * scale)),
        y: Math.round(anchor.y + (offsetY1080 * scale) + (t.row * pitch1080 * scale)),
        w: Math.round(textW1080 * scale),
        h: Math.round(textH1080 * scale)
      };
    }

    return rois;
  }

  function drawDebugOverlays(ctx, anchor, rois, gameArea) {
    // 検索エリア枠（黄色点線）
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 1;
    ctx.strokeRect(
      gameArea.x + (gameArea.w * 0.038),
      gameArea.y + (gameArea.h * 0.190),
      gameArea.w * 0.027,
      gameArea.h * 0.050
    );

    // 黄色アンカー位置（赤丸）
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 8, 0, Math.PI * 2);
    ctx.stroke();

    // 7箇所の切り出し枠（水色）
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#00d5ff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#00d5ff';

    for (const [key, rect] of Object.entries(rois)) {
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillText(rect.label, rect.x, Math.max(12, rect.y - 3));
    }
  }

  function renderCropPreviews(sourceImg, rois) {
    const listHtml = Object.entries(rois).map(([key, rect]) => `
      <div class="crop-item">
        <div class="crop-label">${rect.label}</div>
        <div class="crop-canvas-wrapper">
          <canvas id="crop_${key}" width="${rect.w}" height="${rect.h}"></canvas>
        </div>
      </div>
    `).join('');

    cropsContainer.innerHTML = '<div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 4px;">▼ 自動判定された切り出し領域</div>' + listHtml;
    cropsContainer.style.display = 'flex';

    for (const [key, rect] of Object.entries(rois)) {
      const c = document.getElementById(`crop_${key}`);
      if (c) {
        const cCtx = c.getContext('2d');
        cCtx.drawImage(
          sourceImg,
          rect.x, rect.y, rect.w, rect.h,
          0, 0, rect.w, rect.h
        );
      }
    }
  }
</script>

</body>
</html>
