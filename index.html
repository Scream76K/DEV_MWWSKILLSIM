<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MH Wilds OCR Step 1 - メイン武器（高精度辞書補正版）</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efe1;color:#302b23;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:980px;margin:auto;padding:16px}
h1{font-size:22px;margin:0 0 8px}
h2{font-size:18px;margin:20px 0 10px}
.card{background:#fffaf0;border:1px solid #b9a98b;border-radius:14px;padding:14px;margin-bottom:14px}
.note{font-size:13px;line-height:1.6;color:#625b50}
button,input{font:inherit}
button{border:1px solid #88775c;border-radius:10px;background:#fffaf0;padding:10px 14px}
button.primary{background:#536b3f;color:white;border-color:#435631;font-weight:700}
input[type=file]{width:100%}
#stage{position:relative;overflow:auto;background:#222;border-radius:10px;padding:8px}
#img{display:block;max-width:none;width:100%;height:auto}
#box{position:absolute;border:3px solid #e64b2f;background:rgba(230,75,47,.12);touch-action:none;cursor:move}
.handle{position:absolute;width:18px;height:18px;background:#e64b2f;border-radius:50%}
.tl{left:-9px;top:-9px}.tr{right:-9px;top:-9px}.bl{left:-9px;bottom:-9px}.br{right:-9px;bottom:-9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
input[type=number]{width:100%;padding:8px;border:1px solid #b9a98b;border-radius:8px;background:white}
pre{white-space:pre-wrap;word-break:break-word;background:#201d18;color:#eee;padding:12px;border-radius:10px;min-height:90px}
.result{font-size:18px;font-weight:700;padding:12px;background:#eef2e8;border-radius:10px}
.corrected-tag{display:inline-block;margin-left:8px;padding:2px 8px;font-size:12px;background:#536b3f;color:white;border-radius:4px}
.status{font-size:13px;margin-top:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}main{padding:10px}}
</style>
</head>
<body>
<main>
<div class="card">
<h1>MH Wilds OCR — Step 1.2：メイン武器・名前領域OCR検証（高精度辞書補正付き）</h1>
<div class="note">
OCR認識結果をモンハンワイルズの装備データベースと自動照合し、類似度計算（レーベンシュタイン距離）によって正確な名称へ後処理補正を行います。
</div>
</div>

<div class="card">
<h2>1. スクショを読み込む</h2>
<input id="file" type="file" accept="image/*">
<div id="fileStatus" class="status">画像未選択</div>
</div>

<div class="card">
<h2>2. メイン武器領域</h2>
<div class="note">
赤枠が今回OCRする範囲です。枠の調整でノイズを取り除きます。
</div>
<div id="stage">
  <img id="img" alt="">
  <div id="box">
    <div class="handle tl"></div><div class="handle tr"></div>
    <div class="handle bl"></div><div class="handle br"></div>
  </div>
</div>
<div class="grid" style="margin-top:10px">
  <div><label>左 %</label><input id="x" type="number" step="0.1"></div>
  <div><label>上 %</label><input id="y" type="number" step="0.1"></div>
  <div><label>幅 %</label><input id="w" type="number" step="0.1"></div>
  <div><label>高さ %</label><input id="h" type="number" step="0.1"></div>
</div>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
  <button id="default">初期範囲に戻す</button>
  <button id="ocr" class="primary">🔎 この範囲だけOCR</button>
</div>
</div>

<div class="card">
<h2>3. 切り出した画像</h2>
<canvas id="crop" style="max-width:100%;display:block;border-radius:8px;background:#222"></canvas>
<div style="margin-top:14px;padding-top:12px;border-top:1px solid #c8baa0">
  <div style="font-weight:700;margin-bottom:5px">武器名だけのOCR領域（推奨：上% 48 / 幅% 48）</div>
  <div class="note">「メイン武器」ラベルやスロットアイコンが入らないよう枠を調整してください。</div>
  <div class="grid" style="margin-top:8px">
    <div><label>領域内 左 %</label><input id="nx" type="number" step="0.5" value="12"></div>
    <div><label>領域内 上 %</label><input id="ny" type="number" step="0.5" value="48"></div>
    <div><label>領域内 幅 %</label><input id="nw" type="number" step="0.5" value="48"></div>
    <div><label>領域内 高さ %</label><input id="nh" type="number" step="0.5" value="48"></div>
  </div>
  <canvas id="nameCrop" style="max-width:100%;display:block;margin-top:8px;border-radius:8px;background:#222"></canvas>
</div>
</div>

<div class="card">
<h2>4. OCR結果（辞書補正後）</h2>
<div id="recognized" class="result">未実行</div>
<div class="status" id="ocrStatus"></div>
<pre id="raw"></pre>
</div>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
let imgW=1,imgH=1,drag=null;

// ==========================================
// 1. 武器データベース（辞書）
// ==========================================
// 実装時にはここにMH Wildsの全武器名配列を入れてください
const WEAPON_DICTIONARY = [
  "代償のネイディ・ギア",
  "護鎖刃笛ガルシュハド",
  "炎角竜の大剣",
  "雷顎竜の太刀"
];

// ==========================================
// 2. あいまい検索アルゴリズム（レーベンシュタイン距離）
// ==========================================
function getLevenshteinDistance(a, b) {
  const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,       // 削除
        matrix[i][j - 1] + 1,       // 挿入
        matrix[i - 1][j - 1] + cost // 置換
      );
    }
  }
  return matrix[a.length][b.length];
}

// 辞書の中から最も文字の近い名称を探す関数
function findBestMatch(rawText, dictionary) {
  if (!rawText) return { name: "", distance: 999, similarity: 0 };
  
  // ゴミ記号や空白の除去
  const cleaned = rawText.replace(/[^a-zA-Z0-9\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF・α-γ]/g, "");
  
  let bestMatch = "";
  let minDistance = Infinity;

  for (const item of dictionary) {
    const dist = getLevenshteinDistance(cleaned, item);
    if (dist < minDistance) {
      minDistance = dist;
      bestMatch = item;
    }
  }

  const maxLen = Math.max(cleaned.length, bestMatch.length);
  const similarity = maxLen > 0 ? (1 - minDistance / maxLen) : 0;

  return { name: bestMatch, distance: minDistance, similarity: similarity, rawCleaned: cleaned };
}

// UI 関連処理
function setVals(x,y,w,h){
  $("x").value=x.toFixed(2);$("y").value=y.toFixed(2);
  $("w").value=w.toFixed(2);$("h").value=h.toFixed(2);
  drawBox();updateCrop();
}
function vals(){
  return {
    x:Math.max(0,Math.min(100,Number($("x").value)||0)),
    y:Math.max(0,Math.min(100,Number($("y").value)||0)),
    w:Math.max(1,Math.min(100,Number($("w").value)||1)),
    h:Math.max(1,Math.min(100,Number($("h").value)||1))
  };
}
function drawBox(){
  const v=vals(), rect=$("img").getBoundingClientRect(), stage=$("stage").getBoundingClientRect();
  const left=(v.x/100)*rect.width+(rect.left-stage.left);
  const top=(v.y/100)*rect.height+(rect.top-stage.top);
  const width=(v.w/100)*rect.width, height=(v.h/100)*rect.height;
  Object.assign($("box").style,{left:left+"px",top:top+"px",width:width+"px",height:height+"px"});
}
function updateCrop(){
  if(!$("img").src)return;
  const v=vals();
  const sx=Math.round(imgW*v.x/100), sy=Math.round(imgH*v.y/100);
  const sw=Math.max(1,Math.round(imgW*v.w/100)), sh=Math.max(1,Math.round(imgH*v.h/100));
  const c=$("crop"), ctx=c.getContext("2d");
  const scale=Math.min(2.5,1400/Math.max(sw,sh));
  c.width=Math.max(1,Math.round(sw*scale));c.height=Math.max(1,Math.round(sh*scale));
  ctx.drawImage($("img"),sx,sy,sw,sh,0,0,c.width,c.height);
}
function defaultRegion(){
  setVals(0, 8, 30, 12);
}
$("file").onchange=()=>{
  const f=$("file").files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  $("img").onload=()=>{
    imgW=$("img").naturalWidth;imgH=$("img").naturalHeight;
    $("fileStatus").textContent=`読込完了：${imgW} × ${imgH}`;
    defaultRegion(); drawBox(); updateCrop();
  };
  $("img").src=url;
};
["x","y","w","h"].forEach(id=>$(id).addEventListener("input",()=>{drawBox();updateCrop()}));
window.addEventListener("resize",()=>{drawBox();updateCrop()});
$("default").onclick=defaultRegion;

function pointerPos(e){
  const r=$("stage").getBoundingClientRect();
  const ix=e.clientX-r.left, iy=e.clientY-r.top;
  const ir=$("img").getBoundingClientRect();
  return {x:(ix-(ir.left-r.left))/ir.width*100,y:(iy-(ir.top-r.top))/ir.height*100};
}
$("box").addEventListener("pointerdown",e=>{
  if(e.target.classList.contains("handle"))return;
  e.preventDefault(); $("box").setPointerCapture(e.pointerId);
  const v=vals(), p=pointerPos(e); drag={type:"move",sx:p.x,sy:p.y,v};
});
$("box").addEventListener("pointermove",e=>{
  if(!drag)return;
  const p=pointerPos(e),dx=p.x-drag.sx,dy=p.y-drag.sy,v=drag.v;
  setVals(
    Math.max(0,Math.min(100-v.w,v.x+dx)),
    Math.max(0,Math.min(100-v.h,v.y+dy)),
    v.w,v.h
  );
});
$("box").addEventListener("pointerup",()=>drag=null);
document.querySelectorAll(".handle").forEach(handle=>{
  handle.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    $("box").setPointerCapture(e.pointerId);
    const v=vals(),p=pointerPos(e);
    drag={type:handle.className,v,sx:p.x,sy:p.y};
  });
  handle.addEventListener("pointermove",e=>{
    if(!drag)return;
    const p=pointerPos(e),dx=p.x-drag.sx,dy=p.y-drag.sy,v=drag.v;
    let x=v.x,y=v.y,w=v.w,h=v.h;
    if(drag.type.includes("tr")){y+=dy;h-=dy;w+=dx}
    if(drag.type.includes("tl")){x+=dx;y+=dy;w-=dx;h-=dy}
    if(drag.type.includes("br")){w+=dx;h+=dy}
    if(drag.type.includes("bl")){x+=dx;w-=dx;h+=dy}
    if(w>=1&&h>=1)setVals(Math.max(0,Math.min(99,x)),Math.max(0,Math.min(99,y)),Math.min(100-x,w),Math.min(100-y,h));
  });
  handle.addEventListener("pointerup",()=>drag=null);
});

function sourceCropCanvas(){
  const v=vals();
  const sx=Math.round(imgW*v.x/100), sy=Math.round(imgH*v.y/100);
  const sw=Math.max(1,Math.round(imgW*v.w/100)), sh=Math.max(1,Math.round(imgH*v.h/100));
  const c=document.createElement("canvas"); c.width=sw; c.height=sh;
  const ctx=c.getContext("2d");
  ctx.drawImage($("img"),sx,sy,sw,sh,0,0,sw,sh);
  return c;
}

// 前処理の最適化（白黒反転オプション追加）
function makeNameOCRCanvas(mode){
  const base=sourceCropCanvas();
  const x=Math.max(0,Math.min(99,Number($("nx").value)||0));
  const y=Math.max(0,Math.min(99,Number($("ny").value)||0));
  const w=Math.max(1,Math.min(100-x,Number($("nw").value)||1));
  const h=Math.max(1,Math.min(100-y,Number($("nh").value)||1));
  const sx=Math.round(base.width*x/100), sy=Math.round(base.height*y/100);
  const sw=Math.max(1,Math.round(base.width*w/100)), sh=Math.max(1,Math.round(base.height*h/100));
  const scale=4;
  const c=document.createElement("canvas"); c.width=sw*scale;c.height=sh*scale;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(base,sx,sy,sw,sh,0,0,c.width,c.height);
  
  if(mode !== "color") {
    const d=ctx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4){
      const gray=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];
      let val = gray;
      if(mode==="threshold") val = gray > 140 ? 255 : 0;
      if(mode==="invert") val = gray > 140 ? 0 : 255; // 白黒反転（Tesseractが得意な「黒文字白背景」を作る）
      d.data[i]=d.data[i+1]=d.data[i+2]=val;
    }
    ctx.putImageData(d,0,0);
  }
  return c;
}

function updateNameCrop(){
  if(!$("img").src)return;
  const c=makeNameOCRCanvas("color");
  const out=$("nameCrop"),ctx=out.getContext("2d");
  out.width=c.width;out.height=c.height;ctx.drawImage(c,0,0);
}
["nx","ny","nw","nh"].forEach(id=>$(id).addEventListener("input",updateNameCrop));
const oldUpdateCrop=updateCrop;
updateCrop=function(){oldUpdateCrop();updateNameCrop()};

// ==========================================
// 3. OCR実行と辞書補正の組み込み
// ==========================================
$("ocr").onclick=async()=>{
  if(!$("img").src){$("ocrStatus").textContent="先に画像を選択してください。";return}
  updateCrop(); updateNameCrop();
  $("ocr").disabled=true;
  $("ocrStatus").textContent="武器名の文字行だけを高解像度OCR中…";
  try{
    const worker=await Tesseract.createWorker("jpn");
    const passes=[
      {name:"白黒反転・PSM7",mode:"invert",psm:7},
      {name:"カラー・PSM7",mode:"color",psm:7},
      {name:"カラー・PSM6",mode:"color",psm:6},
      {name:"2値化・PSM7",mode:"threshold",psm:7},
      {name:"グレースケール・PSM7",mode:"gray",psm:7}
    ];
    const results=[];
    for(const p of passes){
      $("ocrStatus").textContent=`OCR中：${p.name}`;
      const c=makeNameOCRCanvas(p.mode);
      const r=await worker.recognize(c,{
        tessedit_pageseg_mode:String(p.psm),
        preserve_interword_spaces:"1"
      });
      
      const rawText = String(r?.data?.text||"").replace(/\s+/g," ").trim();
      const match = findBestMatch(rawText, WEAPON_DICTIONARY);

      results.push({
        name: p.name,
        rawText: rawText,
        correctedName: match.name,
        similarity: match.similarity,
        confidence: Number(r?.data?.confidence||0)
      });
    }
    await worker.terminate();
    
    // 辞書との類似度優先でソート（同じならOCR信頼度でソート）
    results.sort((a,b)=> b.similarity - a.similarity || b.confidence - a.confidence);
    const best=results[0];

    // 結果の表示
    if (best.similarity > 0.4) {
      $("recognized").innerHTML = `${best.correctedName} <span class="corrected-tag">自動補正済み (類似度:${Math.round(best.similarity*100)}%)</span>`;
    } else {
      $("recognized").textContent = best.rawText || "文字を認識できませんでした";
    }

    $("raw").textContent = results.map((r,i)=>
      `【${i+1}位：${r.name}】\n・生OCR出力：${r.rawText || "(空)"}\n・辞書補正結果：${r.correctedName} (一致率: ${Math.round(r.similarity*100)}% / OCR信頼度: ${Math.round(r.confidence)}%)`
    ).join("\n\n");

    $("ocrStatus").textContent=`解析完了。判定結果: ${best.correctedName}`;
  }catch(err){
    $("ocrStatus").textContent="OCRエラー："+String(err);
  }finally{$("ocr").disabled=false}
};
</script>
</body>
</html>
