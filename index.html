<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHWilds 黄色アンカー自動検出 (HSV版)</title>
  <style>
    :root {
      --bg-color: #0f141c;
      --card-bg: #1e2638;
      --accent-color: #00d5ff;
      --text-color: #e0e6ed;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h2 {
      font-size: 1.1rem;
      text-align: center;
      color: var(--accent-color);
      margin: 0 0 12px 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="file"] {
      background: var(--card-bg);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      width: 100%;
      box-sizing: border-box;
    }

    .canvas-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas#stage {
      width: 100%;
      height: auto;
      display: block;
    }

    .status-badge {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    /* デバッグ用マスクプレビュー */
    .debug-box {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .crops-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .crop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2d374d;
      padding-bottom: 6px;
    }

    .crop-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .crop-label {
      font-size: 0.85rem;
      width: 80px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .crop-canvas-wrapper canvas {
      display: block;
      height: 28px;
      width: auto;
      background: #000;
      border: 1px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>MHWilds 黄色アンカー自動検出</h2>
  <input type="file" id="imageInput" accept="image/*">
  
  <div class="status-badge" id="statusText">画像を選択してください</div>

  <div class="canvas-wrapper">
    <canvas id="stage"></canvas>
  </div>

  <!-- スキャン結果の可視化デバッグ領域 -->
  <div class="debug-box" id="debugBox" style="display:none;">
    <div>▼ スキャンエリアの黄色検知マスク (白い部分が検出対象)</div>
    <canvas id="maskCanvas" style="border: 1px solid #ffcc00; margin-top: 4px; max-width: 100%;"></canvas>
  </div>

  <div id="cropsContainer" class="crops-container" style="display: none;"></div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const statusText = document.getElementById('statusText');
  const debugBox = document.getElementById('debugBox');
  const maskCanvas = document.getElementById('maskCanvas');
  const cropsContainer = document.getElementById('cropsContainer');

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      stage.width = img.width;
      stage.height = img.height;
      ctx.drawImage(img, 0, 0);

      // 1. 16:9ゲーム有効エリアを特定
      const gameArea = calculate16by9Area(img.width, img.height);

      // 2. HSVによるアンカー検出
      const anchorResult = findYellowIconAnchorHSV(stage, gameArea);

      // 検索マスクのデバッグ描画
      showDebugMask(anchorResult.maskData, anchorResult.scanW, anchorResult.scanH);

      let anchor = anchorResult.anchor;

      if (!anchor) {
        statusText.textContent = "⚠️ 黄色アンカー未検出（画面比率フォールバックで計算）";
        statusText.style.color = "#ffcc00";
        // フォールバック用の計算
        anchor = {
          x: Math.round(gameArea.x + (gameArea.w * 0.045)),
          y: Math.round(gameArea.y + (gameArea.h * 0.215))
        };
      } else {
        statusText.textContent = `✅ 黄色アンカー検出成功! 座標: (${anchor.x}, ${anchor.y})`;
        statusText.style.color = "#00ff88";
      }

      // 3. ROI計算
      const rois = calculateROIsFromAnchor(anchor, gameArea);

      // 4. デバッグ描画
      drawDebugOverlays(ctx, anchor, rois, anchorResult.scanRect);

      // 5. 切り出しプレビュー
      renderCropPreviews(img, rois);
    };
    img.src = URL.createObjectURL(file);
  });

  function calculate16by9Area(imgW, imgH) {
    const targetAspect = 16 / 9;
    const currentAspect = imgW / imgH;

    let gameW = imgW;
    let gameH = imgH;
    let offsetX = 0;
    let offsetY = 0;

    if (currentAspect > targetAspect) {
      gameW = imgH * targetAspect;
      offsetX = (imgW - gameW) / 2;
    } else if (currentAspect < targetAspect) {
      gameH = imgW / targetAspect;
      offsetY = (imgH - gameH) / 2;
    }

    return { x: offsetX, y: offsetY, w: gameW, h: gameH };
  }

  // RGBからHSVへの変換関数
  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h, s = (max === 0 ? 0 : d / max), v = max;
    if (max !== min) {
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return [h * 360, s, v];
  }

  /**
   * HSV色空間を用いた黄色アイコンアンカー検索
   */
  function findYellowIconAnchorHSV(canvas, gameArea) {
    const ctx = canvas.getContext('2d');

    // スキャンエリア（少し広めに確保）
    const scanX1 = Math.floor(gameArea.x + (gameArea.w * 0.020));
    const scanX2 = Math.floor(gameArea.x + (gameArea.w * 0.090));
    const scanY1 = Math.floor(gameArea.y + (gameArea.h * 0.170));
    const scanY2 = Math.floor(gameArea.y + (gameArea.h * 0.270));
    const scanW = scanX2 - scanX1;
    const scanH = scanY2 - scanY1;

    const imgData = ctx.getImageData(scanX1, scanY1, scanW, scanH);
    const data = imgData.data;

    const maskData = ctx.createImageData(scanW, scanH);
    const mData = maskData.data;

    let totalX = 0;
    let totalY = 0;
    let matchCount = 0;

    for (let y = 0; y < scanH; y++) {
      for (let x = 0; x < scanW; x++) {
        const idx = (y * scanW + x) * 4;
        const r = data[idx];
        const g = data[idx + 1];
        const b = data[idx + 2];

        const [h, s, v] = rgbToHsv(r, g, b);

        // 黄色(Hue: 25°〜65°), 高彩度(S > 0.35), 高明度(V > 0.35)
        if (h >= 25 && h <= 65 && s >= 0.35 && v >= 0.35) {
          totalX += x;
          totalY += y;
          matchCount++;

          // マスクに白で表示
          mData[idx] = 255;
          mData[idx + 1] = 255;
          mData[idx + 2] = 255;
          mData[idx + 3] = 255;
        } else {
          mData[idx + 3] = 255; // 黒背景
        }
      }
    }

    let anchor = null;
    if (matchCount >= 8) {
      anchor = {
        x: Math.round(scanX1 + (totalX / matchCount)),
        y: Math.round(scanY1 + (totalY / matchCount))
      };
    }

    return {
      anchor,
      scanRect: { x: scanX1, y: scanY1, w: scanW, h: scanH },
      maskData,
      scanW,
      scanH
    };
  }

  function calculateROIsFromAnchor(anchor, gameArea) {
    const scale = gameArea.w / 1920;

    // 1080p基準でのアンカー(黄色アイコン中心)からのオフセット
    const offsetX1080 = 52;   // 右へ
    const offsetY1080 = 21;   // 下へ
    const pitch1080   = 85.3; // 1行の間隔
    const textW1080   = 240;
    const textH1080   = 36;

    const targets = [
      { key: 'weaponMain', label: 'メイン武器', row: 0 },
      { key: 'head',       label: '頭防具',     row: 2 },
      { key: 'chest',      label: '胴防具',     row: 3 },
      { key: 'arm',        label: '腕防具',     row: 4 },
      { key: 'waist',      label: '腰防具',     row: 5 },
      { key: 'leg',        label: '脚防具',     row: 6 },
      { key: 'charm',      label: '護石',       row: 7 }
    ];

    const rois = {};
    for (const t of targets) {
      rois[t.key] = {
        label: t.label,
        x: Math.round(anchor.x + (offsetX1080 * scale)),
        y: Math.round(anchor.y + (offsetY1080 * scale) + (t.row * pitch1080 * scale)),
        w: Math.round(textW1080 * scale),
        h: Math.round(textH1080 * scale)
      };
    }

    return rois;
  }

  function showDebugMask(maskData, w, h) {
    debugBox.style.display = 'block';
    maskCanvas.width = w;
    maskCanvas.height = h;
    const mCtx = maskCanvas.getContext('2d');
    mCtx.putImageData(maskData, 0, 0);
  }

  function drawDebugOverlays(ctx, anchor, rois, scanRect) {
    // スキャンした検索枠（黄色破線）
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(scanRect.x, scanRect.y, scanRect.w, scanRect.h);
    ctx.setLineDash([]);

    // 検出されたアンカー（赤丸）
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 8, 0, Math.PI * 2);
    ctx.stroke();

    // 7箇所の枠（水色）
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#00d5ff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#00d5ff';

    for (const [key, rect] of Object.entries(rois)) {
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillText(rect.label, rect.x, Math.max(12, rect.y - 3));
    }
  }

  function renderCropPreviews(sourceImg, rois) {
    const listHtml = Object.entries(rois).map(([key, rect]) => `
      <div class="crop-item">
        <div class="crop-label">${rect.label}</div>
        <div class="crop-canvas-wrapper">
          <canvas id="crop_${key}" width="${rect.w}" height="${rect.h}"></canvas>
        </div>
      </div>
    `).join('');

    cropsContainer.innerHTML = '<div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 4px;">▼ 切り出しプレビュー</div>' + listHtml;
    cropsContainer.style.display = 'flex';

    for (const [key, rect] of Object.entries(rois)) {
      const c = document.getElementById(`crop_${key}`);
      if (c) {
        const cCtx = c.getContext('2d');
        cCtx.drawImage(
          sourceImg,
          rect.x, rect.y, rect.w, rect.h,
          0, 0, rect.w, rect.h
        );
      }
    }
  }
</script>

</body>
</html>
