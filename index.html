<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHWilds 装備一括OCRスキャナー</title>
  
  <!-- Tesseract.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-color: #0f141c;
      --card-bg: #1e2638;
      --accent-color: #00d5ff;
      --text-color: #e0e6ed;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h2 {
      font-size: 1.1rem;
      text-align: center;
      color: var(--accent-color);
      margin: 0 0 12px 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="file"] {
      background: var(--card-bg);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      width: 100%;
      box-sizing: border-box;
    }

    .btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.4;
    }

    .canvas-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    .status-badge {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    /* OCR結果カード表示 */
    .result-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d374d;
      padding-bottom: 6px;
    }

    .result-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .result-label {
      font-size: 0.85rem;
      color: var(--accent-color);
      font-weight: bold;
      width: 90px;
    }

    .result-value {
      font-size: 0.95rem;
      font-family: monospace;
      text-align: right;
      flex-grow: 1;
      word-break: break-all;
    }

    /* 原文ログ領域 */
    .raw-log {
      background: #000;
      color: #888;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 8px;
      border-radius: 6px;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>MHWilds 装備一括OCRスキャナー</h2>
  
  <input type="file" id="imageInput" accept="image/*">

  <div class="canvas-wrapper">
    <canvas id="cropStage"></canvas>
  </div>

  <button id="runBtn" class="btn" disabled>装備を一括認識</button>

  <div class="status-badge" id="statusText">画像を選択してください</div>

  <div class="result-card" id="resultCard" style="display: none;">
    <div class="result-row"><div class="result-label">メイン武器</div><div class="result-value" id="res_weaponMain">-</div></div>
    <div class="result-row"><div class="result-label">頭防具</div><div class="result-value" id="res_head">-</div></div>
    <div class="result-row"><div class="result-label">胴防具</div><div class="result-value" id="res_chest">-</div></div>
    <div class="result-row"><div class="result-label">腕防具</div><div class="result-value" id="res_arm">-</div></div>
    <div class="result-row"><div class="result-label">腰防具</div><div class="result-value" id="res_waist">-</div></div>
    <div class="result-row"><div class="result-label">脚防具</div><div class="result-value" id="res_leg">-</div></div>
    <div class="result-row"><div class="result-label">護石</div><div class="result-value" id="res_charm">-</div></div>
  </div>

  <div class="raw-log" id="rawLog" style="display: none;"></div>
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const cropStage = document.getElementById('cropStage');
  const ctx = cropStage.getContext('2d');
  const runBtn = document.getElementById('runBtn');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');
  const rawLog = document.getElementById('rawLog');

  let currentCropCanvas = null;

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      // 1. 16:9ゲーム有効領域の計算
      const gameArea = calculate16by9Area(img.width, img.height);

      // 2. 左側装備パネル（パネル全体）を余裕を持って大雑把に切り出し
      // X: ゲーム画面の 3%〜33%, Y: 18%〜92%
      const cropX = Math.floor(gameArea.x + (gameArea.w * 0.03));
      const cropY = Math.floor(gameArea.y + (gameArea.h * 0.18));
      const cropW = Math.floor(gameArea.w * 0.30);
      const cropH = Math.floor(gameArea.h * 0.74);

      cropStage.width = cropW;
      cropStage.height = cropH;

      ctx.drawImage(
        img,
        cropX, cropY, cropW, cropH,
        0, 0, cropW, cropH
      );

      currentCropCanvas = cropStage;
      runBtn.disabled = false;
      statusText.textContent = "パネル領域の切り出し成功。「装備を一括認識」を押してください";
      resultCard.style.display = 'none';
      rawLog.style.display = 'none';
    };
    img.src = URL.createObjectURL(file);
  });

  // OCRの実行とパース処理
  runBtn.addEventListener('click', async () => {
    if (!currentCropCanvas) return;

    runBtn.disabled = true;
    statusText.textContent = "OCRエンジン準備中...";

    try {
      // 日本語モデルのロード
      const worker = await Tesseract.createWorker('jpn');

      statusText.textContent = "文字認識を実行中...（数秒かかります）";

      // OCRの実行（行・単語単位の構造データを取得）
      const ret = await worker.recognize(currentCropCanvas);
      const textLines = ret.data.lines;

      statusText.textContent = "テキスト構造を解析中...";

      // ログ表示（デバッグ用）
      rawLog.textContent = "▼ OCR検出テキスト（原文）:\n" + ret.data.text;
      rawLog.style.display = 'block';

      // 抽出パース処理
      const parsedData = parseEquipmentLines(textLines);

      // 画面カードへ反映
      for (const [key, val] of Object.entries(parsedData)) {
        const el = document.getElementById(`res_${key}`);
        if (el) el.textContent = val;
      }

      resultCard.style.display = 'flex';
      statusText.textContent = "✅ 解析完了!";

      await worker.terminate();
    } catch (err) {
      console.error(err);
      statusText.textContent = "❌ エラーが発生しました: " + err.message;
    } finally {
      runBtn.disabled = false;
    }
  });

  // 16:9領域算出
  function calculate16by9Area(imgW, imgH) {
    const targetAspect = 16 / 9;
    const currentAspect = imgW / imgH;

    let gameW = imgW, gameH = imgH;
    let offsetX = 0, offsetY = 0;

    if (currentAspect > targetAspect) {
      gameW = imgH * targetAspect;
      offsetX = (imgW - gameW) / 2;
    } else if (currentAspect < targetAspect) {
      gameH = imgW / targetAspect;
      offsetY = (imgH - gameH) / 2;
    }

    return { x: offsetX, y: offsetY, w: gameW, h: gameH };
  }

  /**
   * 行データから見出しラベルを探し、直後のテキストを装備名として自動マッピングするコアロジック
   */
  function parseEquipmentLines(lines) {
    const results = {
      weaponMain: '（未検出）',
      head:       '（未検出）',
      chest:      '（未検出）',
      arm:        '（未検出）',
      waist:      '（未検出）',
      leg:        '（未検出）',
      charm:      '（未検出）'
    };

    const targets = [
      { key: 'weaponMain', keywords: ['メイン武器', 'メイン', '武器'] },
      { key: 'head',       keywords: ['頭防具', '頭防', '頭'] },
      { key: 'chest',      keywords: ['胴防具', '胴防', '胴'] },
      { key: 'arm',        keywords: ['腕防具', '腕防', '腕'] },
      { key: 'waist',      keywords: ['腰防具', '腰防', '腰'] },
      { key: 'leg',        keywords: ['脚防具', '脚防', '脚'] },
      { key: 'charm',      keywords: ['護石', '護'] }
    ];

    // 不要な空白や特殊文字を除去した行リストを作成
    const cleanLines = lines.map(lineObj => {
      return lineObj.text.replace(/[\s　]+/g, '').trim();
    }).filter(t => t.length > 0);

    // 全キーワードの集合（誤検出防止用）
    const allKeywords = targets.flatMap(t => t.keywords).concat(['サブ武器', 'サブ', '装衣']);

    for (let i = 0; i < cleanLines.length; i++) {
      const lineText = cleanLines[i];

      for (const target of targets) {
        // 現在の部位のキーワードに一致するかチェック
        if (target.keywords.some(kw => lineText.includes(kw))) {
          
          // 見出しが見つかったら、直後の行（i+1 〜 i+2）から装備名と思われる行を探す
          for (let offset = 1; offset <= 2; offset++) {
            if (i + offset < cleanLines.length) {
              const candidate = cleanLines[i + offset];

              // 直後の行が「他の見出しキーワード」を含んでいない場合、それを装備名と判定
              const isAnotherHeader = allKeywords.some(kw => candidate.includes(kw));
              if (!isAnotherHeader && candidate.length > 1) {
                results[target.key] = candidate;
                break;
              }
            }
          }

        }
      }
    }

    return results;
  }
</script>

</body>
</html>
