<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHWilds 装備検出デバッガー</title>
  <style>
    :root {
      --bg-color: #0f141c;
      --card-bg: #1e2638;
      --accent-color: #00d5ff;
      --text-color: #e0e6ed;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h2 {
      font-size: 1.2rem;
      text-align: center;
      color: var(--accent-color);
      margin: 0 0 12px 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="file"] {
      background: var(--card-bg);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      width: 100%;
      box-sizing: border-box;
    }

    .canvas-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas#stage {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 切り出しプレビュー一覧 */
    .crops-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .crop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2d374d;
      padding-bottom: 6px;
    }

    .crop-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .crop-label {
      font-size: 0.85rem;
      width: 80px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .crop-canvas-wrapper {
      background: #000;
      border: 1px solid #444;
      border-radius: 4px;
      overflow: hidden;
    }

    .crop-canvas-wrapper canvas {
      display: block;
      height: 28px;
      width: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>MHWilds 装備領域判定デバッガー</h2>
  <input type="file" id="imageInput" accept="image/*">
  
  <div class="canvas-wrapper">
    <canvas id="stage"></canvas>
  </div>

  <div id="cropsContainer" class="crops-container" style="display: none;">
    <!-- 切り出し画像がここに動的追加されます -->
  </div>
</div>

<script>
  // 1920x1080 基準での左側装備テキストのROI定義 (対象7箇所)
  const ROI_PRESETS_1080P = {
    weaponMain: { x: 88, y: 259, w: 250, h: 36, label: "メイン武器" },
    head:       { x: 88, y: 431, w: 250, h: 36, label: "頭防具" },
    chest:      { x: 88, y: 516, w: 250, h: 36, label: "胴防具" },
    arm:        { x: 88, y: 602, w: 250, h: 36, label: "腕防具" },
    waist:      { x: 88, y: 687, w: 250, h: 36, label: "腰防具" },
    leg:        { x: 88, y: 773, w: 250, h: 36, label: "脚防具" },
    charm:      { x: 88, y: 858, w: 250, h: 36, label: "護石" }
  };

  const imageInput = document.getElementById('imageInput');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const cropsContainer = document.getElementById('cropsContainer');

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      stage.width = img.width;
      stage.height = img.height;
      ctx.drawImage(img, 0, 0);

      // 1. 解像度に合わせたROI座標計算
      const rois = calculateROIBounds(img.width, img.height);
      
      // 2. メイン画像上に青枠を描画
      drawROIBounds(ctx, rois);

      // 3. 切り出した箇所の個別プレビューを描画
      renderCropPreviews(img, rois);
    };
    img.src = URL.createObjectURL(file);
  });

  function calculateROIBounds(imgWidth, imgHeight) {
    const targetAspect = 16 / 9;
    const currentAspect = imgWidth / imgHeight;

    let activeW = imgWidth;
    let activeH = imgHeight;
    let offsetX = 0;
    let offsetY = 0;

    if (currentAspect > targetAspect) {
      activeW = imgHeight * targetAspect;
      offsetX = (imgWidth - activeW) / 2;
    } else if (currentAspect < targetAspect) {
      activeH = imgWidth / targetAspect;
      offsetY = (imgHeight - activeH) / 2;
    }

    const scale = activeW / 1920;
    const calculatedROIs = {};

    for (const [key, rect] of Object.entries(ROI_PRESETS_1080P)) {
      calculatedROIs[key] = {
        label: rect.label,
        x: Math.round(offsetX + (rect.x * scale)),
        y: Math.round(offsetY + (rect.y * scale)),
        w: Math.round(rect.w * scale),
        h: Math.round(rect.h * scale)
      };
    }

    return calculatedROIs;
  }

  function drawROIBounds(ctx, rois) {
    ctx.lineWidth = Math.max(2, Math.round(stage.width / 600));
    ctx.font = `bold ${Math.max(12, Math.round(stage.width / 80))}px sans-serif`;

    for (const [key, rect] of Object.entries(rois)) {
      ctx.strokeStyle = '#00d5ff';
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      
      ctx.fillStyle = '#00d5ff';
      ctx.fillText(rect.label, rect.x, Math.max(15, rect.y - 5));
    }
  }

  function renderCropPreviews(sourceImg, rois) {
    const listHtml = Object.entries(rois).map(([key, rect]) => `
      <div class="crop-item">
        <div class="crop-label">${rect.label}</div>
        <div class="crop-canvas-wrapper">
          <canvas id="crop_${key}" width="${rect.w}" height="${rect.h}"></canvas>
        </div>
      </div>
    `).join('');

    cropsContainer.innerHTML = '<div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 4px;">▼ 切り出しプレビュー (7箇所)</div>' + listHtml;
    cropsContainer.style.display = 'flex';

    for (const [key, rect] of Object.entries(rois)) {
      const c = document.getElementById(`crop_${key}`);
      if (c) {
        const cCtx = c.getContext('2d');
        cCtx.drawImage(
          sourceImg,
          rect.x, rect.y, rect.w, rect.h,
          0, 0, rect.w, rect.h
        );
      }
    }
  }
</script>

</body>
</html>
