<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHWilds ROI Tester</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #0f141c;
      color: #e0e6ed;
      font-family: sans-serif;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="file"] {
      background: #1e2638;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #00d5ff;
    }
    .canvas-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>MHWilds ROI 判定デバッガー</h2>
  <input type="file" id="imageInput" accept="image/*">
  <div class="canvas-wrapper">
    <canvas id="stage"></canvas>
  </div>
</div>

<script>
  const ROI_PRESETS_1080P = {
    // 装備名称
    weaponMain:    { x: 92,  y: 253, w: 240, h: 36 },
    weaponSub:     { x: 92,  y: 424, w: 240, h: 36 },
    head:          { x: 92,  y: 595, w: 240, h: 36 },
    chest:         { x: 92,  y: 764, w: 240, h: 36 },
    arm:           { x: 92,  y: 935, w: 240, h: 36 },
    
    // 全身スキル
    skillsAll:     { x: 1220, y: 230, w: 280, h: 630 },

    // ステータス
    statusAttack:  { x: 1800, y: 330, w: 90,  h: 36 },
    statusCrit:    { x: 1800, y: 362, w: 90,  h: 36 },
    statusElement: { x: 1800, y: 394, w: 90,  h: 36 },
    statusDef:     { x: 1800, y: 780, w: 90,  h: 36 }
  };

  const imageInput = document.getElementById('imageInput');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      stage.width = img.width;
      stage.height = img.height;
      ctx.drawImage(img, 0, 0);

      // ROI座標の計算と描画
      const rois = calculateROIBounds(img.width, img.height);
      drawROIBounds(ctx, rois);
    };
    img.src = URL.createObjectURL(file);
  });

  function calculateROIBounds(imgWidth, imgHeight) {
    const targetAspect = 16 / 9;
    const currentAspect = imgWidth / imgHeight;

    let activeW = imgWidth;
    let activeH = imgHeight;
    let offsetX = 0;
    let offsetY = 0;

    if (currentAspect > targetAspect) {
      activeW = imgHeight * targetAspect;
      offsetX = (imgWidth - activeW) / 2;
    } else if (currentAspect < targetAspect) {
      activeH = imgWidth / targetAspect;
      offsetY = (imgHeight - activeH) / 2;
    }

    const scale = activeW / 1920;
    const calculatedROIs = {};

    for (const [key, rect] of Object.entries(ROI_PRESETS_1080P)) {
      calculatedROIs[key] = {
        x: Math.round(offsetX + (rect.x * scale)),
        y: Math.round(offsetY + (rect.y * scale)),
        w: Math.round(rect.w * scale),
        h: Math.round(rect.h * scale)
      };
    }

    return calculatedROIs;
  }

  function drawROIBounds(ctx, rois) {
    ctx.lineWidth = Math.max(2, Math.round(stage.width / 600));
    ctx.font = `bold ${Math.max(12, Math.round(stage.width / 90))}px sans-serif`;

    for (const [key, rect] of Object.entries(rois)) {
      // 色分け
      if (key.startsWith('weapon') || key.startsWith('head') || key.startsWith('chest') || key.startsWith('arm')) {
        ctx.strokeStyle = '#00d5ff'; // 装備系：シアン
      } else if (key.startsWith('skills')) {
        ctx.strokeStyle = '#00ff88'; // スキル：緑
      } else {
        ctx.strokeStyle = '#ff3366'; // ステータス：赤
      }

      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      
      // ラベル表示
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fillText(key, rect.x, Math.max(15, rect.y - 5));
    }
  }
</script>

</body>
</html>
