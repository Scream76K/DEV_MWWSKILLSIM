<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHWilds 精密装備＆装飾品スキャナー</title>
  
  <!-- Tesseract.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-color: #0f141c;
      --card-bg: #1e2638;
      --accent-color: #00d5ff;
      --text-color: #e0e6ed;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h2 {
      font-size: 1.1rem;
      text-align: center;
      color: var(--accent-color);
      margin: 0 0 12px 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2d374d;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="file"] {
      background: var(--card-bg);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
      width: 100%;
      box-sizing: border-box;
    }

    .btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.4;
    }

    .canvas-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    .status-badge {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d374d;
      padding-bottom: 6px;
    }

    .result-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .result-label {
      font-size: 0.85rem;
      color: var(--accent-color);
      font-weight: bold;
      width: 100px;
    }

    .result-value {
      font-size: 0.95rem;
      font-family: monospace;
      text-align: right;
      flex-grow: 1;
      font-weight: bold;
      color: #fff;
    }

    hr.divider {
      border: none;
      border-top: 1px dashed #2d374d;
      margin: 8px 0;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 【1】装備画面スキャナー -->
  <div class="section-card">
    <h2>⚔️ 1. 装備画面スキャナー</h2>
    <input type="file" id="imageInput" accept="image/*">
    <div class="canvas-wrapper">
      <canvas id="stage"></canvas>
    </div>
    <button id="runBtn" class="btn" disabled>装備名をOCR解析</button>
    <div class="status-badge" id="statusText">画像を選択してください</div>
    <div class="result-card" id="resultCard" style="display: none;">
      <div class="result-row"><div class="result-label">メイン武器</div><div class="result-value" id="res_weaponMain">-</div></div>
      <div class="result-row"><div class="result-label">頭防具</div><div class="result-value" id="res_head">-</div></div>
      <div class="result-row"><div class="result-label">胴防具</div><div class="result-value" id="res_chest">-</div></div>
      <div class="result-row"><div class="result-label">腕防具</div><div class="result-value" id="res_arm">-</div></div>
      <div class="result-row"><div class="result-label">腰防具</div><div class="result-value" id="res_waist">-</div></div>
      <div class="result-row"><div class="result-label">脚防具</div><div class="result-value" id="res_leg">-</div></div>
      <div class="result-row"><div class="result-label">護石</div><div class="result-value" id="res_charm">-</div></div>
    </div>
  </div>

  <hr class="divider">

  <!-- 【2】装飾品画面スキャナー (24行固定) -->
  <div class="section-card">
    <h2>💎 2. 装飾品画面スキャナー (24行)</h2>
    <input type="file" id="decoImageInput" accept="image/*">
    <div class="canvas-wrapper">
      <canvas id="decoStage"></canvas>
    </div>
    <button id="decoRunBtn" class="btn" disabled>装飾品をOCR解析</button>
    <div class="status-badge" id="decoStatusText">装飾品画面の画像を選択してください</div>
    <div class="result-card" id="decoResultCard" style="display: none;"></div>
  </div>

</div>

<script>
  /* --------------------------------------------------
   * 【改善版】ゲーム画面（16:9領域）の堅牢な自動切り出し
   * -------------------------------------------------- */
  function findGameScreen16by9(canvasCtx, imgW, imgH) {
    // 画像アスペクト比がすでに約16:9なら、画像全体をゲーム画面とする
    const imgAspect = imgW / imgH;
    if (Math.abs(imgAspect - (16 / 9)) < 0.05) {
      return { x: 0, y: 0, w: imgW, h: imgH };
    }

    // 縦長画像（スマホスクショ）の場合：幅基準で16:9領域を中央配置と仮定
    let gameW = imgW;
    let gameH = imgW * (9 / 16);

    // 高さが画像を超える場合は高さ基準
    if (gameH > imgH) {
      gameH = imgH;
      gameW = imgH * (16 / 9);
    }

    // 画像中央付近にゲーム画面を置く
    let x = (imgW - gameW) / 2;
    let y = (imgH - gameH) / 2;

    // もしWeb UIのせいでゲーム画面が上に寄っている場合の簡易補正（画像中央〜やや上）
    if (imgH > imgW) {
      y = imgH * 0.22; // スマホ縦スクショの中央表示エリアの一般的な開始位置
    }

    return { x: Math.round(x), y: Math.round(y), w: Math.round(gameW), h: Math.round(gameH) };
  }

  /* --------------------------------------------------
   * 【1】装備画面スキャナー
   * -------------------------------------------------- */
  const TARGET_EQUIPMENTS = [
    { key: 'weaponMain', label: 'メイン武器', row: 0, yOffsetRatio: -0.004 },
    { key: 'head',       label: '頭防具',     row: 2, yOffsetRatio:  0.000 },
    { key: 'chest',      label: '胴防具',     row: 3, yOffsetRatio:  0.000 },
    { key: 'arm',        label: '腕防具',     row: 4, yOffsetRatio:  0.000 },
    { key: 'waist',      label: '腰防具',     row: 5, yOffsetRatio:  0.000 },
    { key: 'leg',        label: '脚防具',     row: 6, yOffsetRatio:  0.000 },
    { key: 'charm',      label: '護石',       row: 7, yOffsetRatio:  0.004 }
  ];

  const imageInput = document.getElementById('imageInput');
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const runBtn = document.getElementById('runBtn');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');

  let currentImg = null;
  let computedROIs = {};

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      currentImg = img;
      stage.width = img.width;
      stage.height = img.height;
      ctx.drawImage(img, 0, 0);

      const gameArea = findGameScreen16by9(ctx, img.width, img.height);

      // 赤枠で検知したゲーム画面を描画（デバッグ可視化）
      ctx.lineWidth = Math.max(4, Math.round(img.width / 300));
      ctx.strokeStyle = '#ff0055';
      ctx.strokeRect(gameArea.x, gameArea.y, gameArea.w, gameArea.h);

      computedROIs = calculatePercentageROIs(gameArea);
      drawROIBounds(ctx, computedROIs);

      runBtn.disabled = false;
      statusText.textContent = "赤枠（ゲーム認識領域）と青枠（認識ターゲット）を確認してください";
      resultCard.style.display = 'none';
    };
    img.src = URL.createObjectURL(file);
  });

  function calculatePercentageROIs(gameArea) {
    const startXRatio  = 0.048, startYRatio  = 0.147, pitchYRatio  = 0.0904, widthRatio   = 0.123, heightRatio  = 0.032;
    const cropX = gameArea.x + (gameArea.w * startXRatio);
    const cropW = gameArea.w * widthRatio;
    const cropH = gameArea.h * heightRatio;

    const rois = {};
    for (const item of TARGET_EQUIPMENTS) {
      const calculatedYRatio = startYRatio + (item.row * pitchYRatio) + item.yOffsetRatio;
      rois[item.key] = {
        label: item.label,
        x: Math.round(cropX),
        y: Math.round(gameArea.y + (gameArea.h * calculatedYRatio)),
        w: Math.round(cropW),
        h: Math.round(cropH)
      };
    }
    return rois;
  }

  function drawROIBounds(ctx, rois) {
    ctx.lineWidth = Math.max(2, Math.round(stage.width / 700));
    ctx.strokeStyle = '#00d5ff';
    ctx.fillStyle = '#00d5ff';
    ctx.font = 'bold 12px sans-serif';

    for (const [key, rect] of Object.entries(rois)) {
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.fillText(rect.label, rect.x, Math.max(12, rect.y - 4));
    }
  }

  runBtn.addEventListener('click', async () => {
    if (!currentImg || !computedROIs) return;
    runBtn.disabled = true;
    statusText.textContent = "OCR解析中...";

    try {
      const worker = await Tesseract.createWorker('jpn');
      resultCard.style.display = 'flex';

      for (const [key, rect] of Object.entries(computedROIs)) {
        const processedCanvas = preprocessCropImage(currentImg, rect);
        const ret = await worker.recognize(processedCanvas);
        const cleanText = ret.data.text.replace(/[\s\n\r\t|="'_.,;:-]+/g, '').trim();
        const el = document.getElementById(`res_${key}`);
        if (el) el.textContent = cleanText || '（読み取り失敗）';
      }
      statusText.textContent = "✅ 装備の解析が完了しました！";
      await worker.terminate();
    } catch (err) {
      statusText.textContent = "❌ エラー: " + err.message;
    } finally {
      runBtn.disabled = false;
    }
  });

  function preprocessCropImage(sourceImg, rect) {
    const canvas = document.createElement('canvas');
    const scale = 3;
    canvas.width = rect.w * scale; canvas.height = rect.h * scale;
    const pCtx = canvas.getContext('2d');
    pCtx.imageSmoothingEnabled = false;
    pCtx.drawImage(sourceImg, rect.x, rect.y, rect.w, rect.h, 0, 0, canvas.width, canvas.height);
    const imgData = pCtx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      const avg = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      const val = avg > 120 ? 0 : 255;
      data[i] = val; data[i + 1] = val; data[i + 2] = val;
    }
    pCtx.putImageData(imgData, 0, 0);
    return canvas;
  }

  /* --------------------------------------------------
   * 【2】装飾品画面スキャナー
   * -------------------------------------------------- */
  const DECORATION_GRID_CONFIG = {
    maxRows: 24,
    startXRatio: 0.102,
    startYRatio: 0.103,
    pitchYRatio: 0.0415,
    widthRatio:  0.068,
    heightRatio: 0.026
  };

  const decoImageInput = document.getElementById('decoImageInput');
  const decoStage = document.getElementById('decoStage');
  const decoCtx = decoStage.getContext('2d');
  const decoRunBtn = document.getElementById('decoRunBtn');
  const decoStatusText = document.getElementById('decoStatusText');
  const decoResultCard = document.getElementById('decoResultCard');

  let decoCurrentImg = null;
  let decoComputedROIs = [];

  decoImageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      decoCurrentImg = img;
      decoStage.width = img.width;
      decoStage.height = img.height;
      decoCtx.drawImage(img, 0, 0);

      // ゲーム画面16:9領域を検出
      const gameArea = findGameScreen16by9(decoCtx, img.width, img.height);

      // ★赤枠で「プログラムが認識しているゲーム画面」を描画★
      decoCtx.lineWidth = Math.max(4, Math.round(img.width / 300));
      decoCtx.strokeStyle = '#ff0055';
      decoCtx.strokeRect(gameArea.x, gameArea.y, gameArea.w, gameArea.h);

      // 24行ROI計算＆青枠描画
      decoComputedROIs = calculateDecorationROIs(gameArea);
      drawDecoROIBounds(decoCtx, decoComputedROIs);

      decoRunBtn.disabled = false;
      decoStatusText.textContent = "赤枠（ゲーム認識領域）と青枠（24行）の位置を確認してください";
      decoResultCard.style.display = 'none';
    };
    img.src = URL.createObjectURL(file);
  });

  function calculateDecorationROIs(gameArea) {
    const cfg = DECORATION_GRID_CONFIG;
    const cropX = gameArea.x + (gameArea.w * cfg.startXRatio);
    const cropW = gameArea.w * cfg.widthRatio;
    const cropH = gameArea.h * cfg.heightRatio;

    const rois = [];
    for (let row = 0; row < cfg.maxRows; row++) {
      const calculatedYRatio = cfg.startYRatio + (row * cfg.pitchYRatio);
      rois.push({
        rowIndex: row,
        label: `枠 ${row + 1}`,
        x: Math.round(cropX),
        y: Math.round(gameArea.y + (gameArea.h * calculatedYRatio)),
        w: Math.round(cropW),
        h: Math.round(cropH)
      });
    }
    return rois;
  }

  function drawDecoROIBounds(canvasCtx, rois) {
    canvasCtx.lineWidth = Math.max(2, Math.round(decoStage.width / 700));
    canvasCtx.strokeStyle = '#00d5ff';
    canvasCtx.fillStyle = '#00d5ff';
    canvasCtx.font = 'bold 11px sans-serif';

    for (const rect of rois) {
      canvasCtx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      if (rect.rowIndex % 5 === 0) {
        canvasCtx.fillText(rect.label, rect.x, Math.max(12, rect.y - 2));
      }
    }
  }

  decoRunBtn.addEventListener('click', async () => {
    if (!decoCurrentImg || decoComputedROIs.length === 0) return;
    decoRunBtn.disabled = true;
    decoStatusText.textContent = "OCR解析中...";

    try {
      const worker = await Tesseract.createWorker('jpn');
      decoResultCard.style.display = 'flex';
      decoResultCard.innerHTML = '';

      for (const rect of decoComputedROIs) {
        const processedCanvas = preprocessDecoCropImage(decoCurrentImg, rect);
        const ret = await worker.recognize(processedCanvas);
        const cleanText = ret.data.text.replace(/[\s\n\r\t|="'_.,;:-]+/g, '').trim();

        const rowDiv = document.createElement('div');
        rowDiv.className = 'result-row';
        rowDiv.innerHTML = `<div class="result-label">枠 ${rect.rowIndex + 1}</div><div class="result-value">${cleanText || '（なし）'}</div>`;
        decoResultCard.appendChild(rowDiv);
      }
      decoStatusText.textContent = "✅ すべての装飾品スロットの解析が完了しました！";
      await worker.terminate();
    } catch (err) {
      decoStatusText.textContent = "❌ エラー: " + err.message;
    } finally {
      decoRunBtn.disabled = false;
    }
  });

  function preprocessDecoCropImage(sourceImg, rect) {
    const canvas = document.createElement('canvas');
    const scale = 3;
    canvas.width = rect.w * scale; canvas.height = rect.h * scale;
    const pCtx = canvas.getContext('2d');
    pCtx.imageSmoothingEnabled = false;
    pCtx.drawImage(sourceImg, rect.x, rect.y, rect.w, rect.h, 0, 0, canvas.width, canvas.height);

    const imgData = pCtx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;

    let totalLum = 0;
    for (let i = 0; i < data.length; i += 4) {
      totalLum += data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
    }
    const isBrightBg = (totalLum / (data.length / 4)) > 120;

    for (let i = 0; i < data.length; i += 4) {
      const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      let val = isBrightBg ? (lum < 120 ? 0 : 255) : (lum > 120 ? 0 : 255);
      data[i] = val; data[i + 1] = val; data[i + 2] = val;
    }
    pCtx.putImageData(imgData, 0, 0);
    return canvas;
  }
</script>

</body>
</html>
