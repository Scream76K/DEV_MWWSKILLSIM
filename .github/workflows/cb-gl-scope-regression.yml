name: Bounded CB GL SA HH predicate contracts
on:
  push:
    branches: ['work/gl-component-affinity-*', 'work/gl-hh-scope-*']
  pull_request:
    paths:
      - 'hope-hammer-browser-adapter.js'
      - 'index.html'
      - 'tests/cb-h-ordinary-scope.test.cjs'
      - 'tests/charge-master-gl-noncharged-scope.test.cjs'
      - 'tools/cb-gl-scope-regression/**'
      - 'tools/sa-hh-scope-regression/**'
      - 'tools/gl-hh-scope-regression/**'
      - '.github/workflows/cb-gl-scope-regression.yml'
permissions:
  contents: read
jobs:
  synthetic-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current adapter, exact runtime hashes and synthetic boundaries
        run: node tools/gl-hh-scope-regression/run.cjs
      - name: Verify all inherited and current runner freshness checks
        run: node --test tools/cb-gl-scope-regression/freshness.test.cjs tools/sa-hh-scope-regression/freshness.test.cjs tools/gl-hh-scope-regression/freshness.test.cjs
