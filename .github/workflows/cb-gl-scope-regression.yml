permissions:
  contents: read
jobs:
  synthetic-partitions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        partition: [heroics, resolved-attack, remainder]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify partition control
        run: node --test tests/integration-ci-partition.test.cjs
      - name: Run exact contract partition
        env:
          REPORT_DIR: ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}
        run: node tools/integration-regression/ci-partition.cjs run ${{ matrix.partition }}
      - name: Retain current evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/contract.json
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/receipt.json
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/summary.json
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/child-*.tap
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/child-*.stderr
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/runner.stdout
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/runner.stderr
  synthetic-boundaries:
    needs: [synthetic-partitions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require every partition to succeed
        env:
          PARTITION_RESULT: ${{ needs.synthetic-partitions.result }}
        run: test "$PARTITION_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-heroics
          path: ${{ runner.temp }}/integrated-partition/heroics
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-resolved-attack
          path: ${{ runner.temp }}/integrated-partition/resolved-attack
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-remainder
          path: ${{ runner.temp }}/integrated-partition/remainder
      - name: Require exact current contract coverage
        run: node tools/integration-regression/ci-partition.cjs aggregate "${{ runner.temp }}/integrated-partition"
      - name: Verify all historical and current runner freshness checks
        run: node --test tools/cb-gl-scope-regression/freshness.test.cjs tools/sa-hh-scope-regression/freshness.test.cjs tools/gl-hh-scope-regression/freshness.test.cjs tools/input-guard-regression/freshness.test.cjs
  current-data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify saved input and current comparison report integrity
        run: >-
          node --test
          tests/charm-saved-level-integrity.test.cjs
          tests/saved-decoration-identity.test.cjs
          tests/r206-charm-skill-integrity.test.cjs
          tests/r250-snapshot-ownership.test.cjs
          tests/legacy-comparison-report-contract.test.cjs
          tools/consumer-ai-comparison-dom.test.cjs
      - name: Verify release UI and OCR parity without private data
        run: >-
          node --test
          tools/armor-skill-layout-dom.test.cjs
          tools/artia-stage-parity.test.cjs
          tools/artia-craft-parity.test.cjs
          tools/charm-public-shortcut-dom.test.cjs
          tools/comparison-fixed-damage-dom.test.cjs
          tools/comparison-self-maximum-dom.test.cjs
          tools/comparison-settings-parity-dom.test.cjs
          tools/maximum-common-skills-dom.test.cjs
          tools/maximum-coupled-series-dom.test.cjs
          tools/comparison-used-combo-dom.test.cjs
          tools/custom-combo-result-dom.test.cjs
          tests/custom-weapon-settings-isolation.test.cjs
          tests/gs-per-move-charge.test.cjs
          tests/bow-explicit-charge.test.cjs
          tools/bow-explicit-charge-dom.test.cjs
          tests/hh-opening-melody.test.cjs
          tests/hh-single-blunt-body.test.cjs
          tests/sa-axe-boost.test.cjs
          tests/cb-custom-settings-parity.test.cjs
          tests/r196-missing-saved-weapon.test.cjs
          tools/bow-mixed-custom-dom.test.cjs
          tests/lance-mid-thrust-picker.test.cjs
          tests/hammer-vertical-picker.test.cjs
          tests/hammer-charged-swing.test.cjs
          tests/hammer-spin-endings.test.cjs
          tests/gs-true-charge-picker.test.cjs
          tests/basic-slash-picker.test.cjs
          tests/typed-move-contacts.test.cjs
          tests/lance-dash-contact.test.cjs
          tests/ls-helm-breaker-red.test.cjs
          tests/gunlance-shell-opening.test.cjs
          tests/cb-ig-ordinary-contacts.test.cjs
          tests/hbg-wyvern-capacity.test.cjs
          tests/hh-performance-comparison.test.cjs
          tests/ls-foresight-spin-picker.test.cjs
          tests/lance-high-thrust-picker.test.cjs
          tests/lance-counter-conversion.test.cjs
          tests/ig-enhanced-single-opening.test.cjs
          tests/sa-sword-vertical-opening.test.cjs
          tests/saved-single-opening.test.cjs
          tools/combo-simple-names-dom.test.cjs
          tests/used-combo-adapter.test.cjs
          tools/consumer-form-parity-dom.test.cjs
          tools/king-target-parity-dom.test.cjs
          tools/rounded-font-contract.test.cjs
          tests/lbg-native-saved-parity.test.cjs
          tests/lbg-normal-two-current.test.cjs
          tests/explicit-opening-defaults.test.cjs
          tests/bow372-thousand.test.cjs
          tests/bow372-saved-mixed.test.cjs
          tests/bow372-saved-heterogeneous.test.cjs
          tests/r250-ocr-confirmation.test.cjs
          tests/r250-ocr-confirmation-ui.test.cjs
          tests/r250-ocr-decoration-review.test.cjs
  comparison-session-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the locked Playwright Chromium runtime
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Verify narrow armor and skill columns in Chromium
        run: node --test tools/skill-comparison-browser.test.cjs tools/armor-portrait-layout-browser.test.cjs tools/bow-mixed-custom-browser.test.cjs tools/comparison-portrait-layout-browser.test.cjs tools/custom-weapon-settings-browser.test.cjs tools/gs-per-move-charge-browser.test.cjs tools/bow-explicit-charge-browser.test.cjs
      - name: Verify session and legacy-cache restoration without external API access
        run: node --test tools/comparison-session-reload-browser.test.cjs
