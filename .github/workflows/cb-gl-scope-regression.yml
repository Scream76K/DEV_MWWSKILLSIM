name: Integrated input guard and bounded predicate contracts
on:
  push:
    branches: ['mainline', 'work/gl-component-affinity-*', 'work/gl-hh-scope-*', 'work/input-guard-v3-*', 'work/integrated-latest-*']
  pull_request:
    paths:
      - 'hope-hammer-browser-adapter.js'
      - 'index.html'
      - 'skill-calculation-policy.js'
      - 'skill-effect-continuation.js'
      - 'tests/skill-calculation-policy.test.cjs'
      - 'tests/skill-continuation.test.cjs'
      - 'tests/gl-reference-identity.test.cjs'
      - 'tools/gl-reference-identity-*.cjs'
      - 'tools/skill-continuation-*.cjs'
      - 'tests/cb-h-ordinary-scope.test.cjs'
      - 'tests/charge-master-gl-noncharged-scope.test.cjs'
      - 'tools/cb-gl-scope-regression/**'
      - 'tools/sa-hh-scope-regression/**'
      - 'tools/gl-hh-scope-regression/**'
      - 'tools/input-guard-regression/**'
      - 'tools/integration-regression/**'
      - 'tests/integration-ci-partition.test.cjs'
      - 'tests/integration-ci-dependency.test.cjs'
      - 'tests/charm-saved-level-integrity.test.cjs'
      - 'tests/saved-decoration-identity.test.cjs'
      - 'ui/comparison-session.js'
      - 'ui/local-mhdb-cache.js'
      - 'tests/local-mhdb-cache.test.cjs'
      - 'tools/comparison-session-reload-browser.test.cjs'
      - 'tests/fixtures/comparison-session-inputs.json'
      - 'tests/r206-charm-skill-integrity.test.cjs'
      - 'tests/r250-snapshot-ownership.test.cjs'
      - 'tests/legacy-comparison-report-contract.test.cjs'
      - 'tools/consumer-ai-comparison-*.cjs'
      - 'tools/consumer-ai-comparison-source-skill.json'
      - 'tools/legacy-comparison-report-test-helper.cjs'
      - 'tools/dom-test-setup.cjs'
      - 'tools/legacy-page-test-context.cjs'
      - 'tools/synthetic-combat-fixture.cjs'
      - 'tools/synthetic-combat-source-skills.cjs'
      - 'docs/reports/stage4-bow-representatives/mhdb-loaded-cache.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cb-gl-scope-regression.yml'
permissions:
  contents: read
jobs:
  synthetic-partitions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        partition: [heroics, resolved-attack, remainder]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify partition control
        run: node --test tests/integration-ci-partition.test.cjs
      - name: Run exact contract partition
        env:
          REPORT_DIR: ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}
        run: node tools/integration-regression/ci-partition.cjs run ${{ matrix.partition }}
      - name: Retain current evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/contract.json
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/receipt.json
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/summary.json
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/child-*.tap
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/child-*.stderr
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/runner.stdout
            ${{ runner.temp }}/integrated-partition/${{ matrix.partition }}/runner.stderr
  synthetic-boundaries:
    needs: [synthetic-partitions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require every partition to succeed
        env:
          PARTITION_RESULT: ${{ needs.synthetic-partitions.result }}
        run: test "$PARTITION_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-heroics
          path: ${{ runner.temp }}/integrated-partition/heroics
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-resolved-attack
          path: ${{ runner.temp }}/integrated-partition/resolved-attack
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ github.run_id }}-${{ github.run_attempt }}-remainder
          path: ${{ runner.temp }}/integrated-partition/remainder
      - name: Require exact current contract coverage
        run: node tools/integration-regression/ci-partition.cjs aggregate "${{ runner.temp }}/integrated-partition"
      - name: Verify all historical and current runner freshness checks
        run: node --test tools/cb-gl-scope-regression/freshness.test.cjs tools/sa-hh-scope-regression/freshness.test.cjs tools/gl-hh-scope-regression/freshness.test.cjs tools/input-guard-regression/freshness.test.cjs
  current-data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify saved input and current comparison report integrity
        run: >-
          node --test
          tests/charm-saved-level-integrity.test.cjs
          tests/saved-decoration-identity.test.cjs
          tests/r206-charm-skill-integrity.test.cjs
          tests/r250-snapshot-ownership.test.cjs
          tests/legacy-comparison-report-contract.test.cjs
          tools/consumer-ai-comparison-dom.test.cjs
  comparison-session-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the locked Playwright Chromium runtime
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Verify session and legacy-cache restoration without external API access
        run: node --test tools/comparison-session-reload-browser.test.cjs
