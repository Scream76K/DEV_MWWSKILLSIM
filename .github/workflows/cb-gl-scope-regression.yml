name: Input guard and bounded predicate contracts
on:
  push:
    branches: ['work/gl-component-affinity-*', 'work/input-guard-v3-*']
  pull_request:
    paths:
      - 'hope-hammer-browser-adapter.js'
      - 'tests/cb-h-ordinary-scope.test.cjs'
      - 'tests/charge-master-gl-noncharged-scope.test.cjs'
      - 'tools/cb-gl-scope-regression/**'
      - 'tools/sa-hh-scope-regression/**'
      - 'tools/input-guard-regression/**'
      - '.github/workflows/cb-gl-scope-regression.yml'
permissions:
  contents: read
jobs:
  synthetic-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current candidate boundaries with exact input hashes
        run: node tools/input-guard-regression/run.cjs
      - name: Verify inherited runner freshness and failure handling
        run: node --test tools/cb-gl-scope-regression/freshness.test.cjs

      - name: Verify inherited SA HH runner freshness and failure handling
        run: node --test tools/sa-hh-scope-regression/freshness.test.cjs

      - name: Verify input guard runner freshness and failure handling
        run: node --test tools/input-guard-regression/freshness.test.cjs
