name: Commit autotest source-only

on:
  push:
    branches:
      - mainline
      - work/commit-autotest-v12-1
    paths:
      - tools/commit-autotest/**
      - .github/workflows/commit-autotest-source.yml
  pull_request:
    branches:
      - mainline
    paths:
      - tools/commit-autotest/**
      - .github/workflows/commit-autotest-source.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-unit:
    name: Synthetic source unit tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: tools/commit-autotest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Record versions and scope
        run: |
          node --version
          git --version
          printf '%s\n' \
            'SOURCE_ONLY: synthetic harness controls.' \
            'This does not execute product E2E or validate DB/game accuracy.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run six source test files
        run: |
          node --test \
            harness/batch-summary.test.cjs \
            harness/commit-snapshot.test.cjs \
            harness/current-evidence.test.cjs \
            harness/gs250-oracle.test.cjs \
            harness/script-coverage.test.cjs \
            harness/skill-contrast.test.cjs
