name: GL component boundary regression
on:
  push:
    branches: ['work/gl-component-affinity-*']
  pull_request:
    paths:
      - 'hope-hammer-browser-adapter.js'
      - 'tests/gl-shell-affinity-scope.test.cjs'
      - 'tests/gl-shell-defensive-scope.test.cjs'
      - 'tests/gl-shell-state-affinity-scope.test.cjs'
      - 'tests/gl-shell-bonus-scope.test.cjs'
      - 'tests/charge-master-noelement-scope.test.cjs'
      - 'tools/gl-component-regression/**'
      - '.github/workflows/gl-component-regression.yml'
permissions:
  contents: read
jobs:
  component-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate candidate component guards and runner failure handling
        run: node --test tests/gl-shell-affinity-scope.test.cjs tests/gl-shell-defensive-scope.test.cjs tests/gl-shell-state-affinity-scope.test.cjs tests/gl-shell-bonus-scope.test.cjs tests/charge-master-noelement-scope.test.cjs tools/gl-component-regression/failure-injection.test.cjs
  product-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the repository product test suite
        run: npm test
