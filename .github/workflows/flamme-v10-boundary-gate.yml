name: V10 boundary gate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Four reviewer gates via public pipeline
        run: node --test v10-six-layer-foundation/min8/review-public-gates.test.cjs
