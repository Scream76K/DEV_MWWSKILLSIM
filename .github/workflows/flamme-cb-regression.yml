name: Flamme CB targeted checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cb-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Targeted production CB contracts only
        run: node --test tests/flamme-cb-*.test.cjs
